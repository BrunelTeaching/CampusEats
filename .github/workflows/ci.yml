name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      # CI only gates on the test suite. The lint and type issues in the target
      # modules are intentional — they are what the coursework asks you to find —
      # so ruff/mypy are NOT run here as pass/fail gates.
      - name: Run tests
        run: pytest -v
